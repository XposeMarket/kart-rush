<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#121b27"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23121b27'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='45'%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E"><title>Kart Rush · Pocket Grand Prix</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><canvas id="race" aria-label="Kart Rush racing game"></canvas><div id="flash"></div>
<header id="hud" class="hidden"><div class="hud-left"><strong id="place">1st</strong><span id="lap">LAP 1 / 3</span><span id="clock">00:00.00</span></div><div class="hud-right"><span id="speed">0 <small>KM/H</small></span><button id="pause" aria-label="Pause">Ⅱ</button><button id="sound" aria-label="Toggle sound">♪</button></div></header>
<div id="item-hud" class="hidden"><span id="item-icon">?</span><small id="item-name">ITEM</small><kbd>SPACE</kbd></div><div id="toast"></div><div id="countdown" class="hidden"></div>
<section id="menu" class="panel"><div class="brand"><span class="eyebrow">★ POCKET GRAND PRIX ★</span><h1>KART <em>RUSH</em></h1><p>Pick your racer. Own the road.</p></div><div class="selectors"><div class="select-block"><div class="select-head"><h2>01 <span>RACER</span></h2><span id="character-info"></span></div><div id="characters" class="choice-grid characters"></div></div><div class="select-block"><div class="select-head"><h2>02 <span>RIDE</span></h2><span id="vehicle-info"></span></div><div id="vehicles" class="choice-grid vehicles"></div></div><div class="select-block"><div class="select-head"><h2>03 <span>TRACK</span></h2><span id="map-info"></span></div><div id="maps" class="choice-grid maps"></div></div></div><div class="menu-bottom"><div id="stats"></div><button id="start" class="primary">START RACE <span>↗</span></button></div><p class="menu-foot">3 laps · 7 CPU rivals · 8 power-ups · no downloads</p></section>
<section id="overlay" class="panel hidden"><span id="overlay-tag" class="eyebrow"></span><h2 id="overlay-title"></h2><p id="overlay-text"></p><div id="results"></div><div class="overlay-actions"><button id="resume" class="primary">RESUME</button><button id="retry">RACE AGAIN</button><button id="back">CHANGE SETUP</button></div></section>
<div id="touch" class="hidden"><div class="touch-left"><button data-control="left" aria-label="Steer left">◀</button><button data-control="right" aria-label="Steer right">▶</button></div><div class="touch-right"><button data-control="item" class="use" aria-label="Use item">ITEM</button><button data-control="drift" class="drift" aria-label="Drift">DRIFT</button><button data-control="gas" class="gas" aria-label="Accelerate">GO</button></div></div>
</main><script src="js/data.js"></script><script src="js/audio.js"></script><script type="module" src="js/three-game.js"></script></body></html>
